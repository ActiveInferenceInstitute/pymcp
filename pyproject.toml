[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymdp-mcp"
version = "1.0.3"
authors = [
  { name="MCP-PyMDP Contributors", email="contact@example.com" },
]
description = "Model Context Protocol (MCP) and REST interface for PyMDP active inference"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "aiohttp>=3.8.1",
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "inferactively-pymdp>=1.0.3",
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
    "pydantic>=1.10.7",
    "python-multipart>=0.0.6",
    "pillow>=9.0.0"
]

[project.urls]
"Homepage" = "https://github.com/ActiveInferenceInstitute/pymcp"
"Bug Tracker" = "https://github.com/ActiveInferenceInstitute/pymcp/issues"
"Repository" = "https://github.com/ActiveInferenceInstitute/pymcp"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.ruff]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
line-length = 88
target-version = "py312"
fix = true
unfixable = ["F401"]

[tool.ruff.isort]
known-first-party = ["mcp"]
known-third-party = ["pymdp", "numpy", "matplotlib", "aiohttp", "fastapi", "pydantic"]
