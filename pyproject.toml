[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymdp-mcp"
version = "1.0.3"
authors = [
  { name="MCP-PyMDP Contributors", email="contact@example.com" },
]
description = "Model Context Protocol (MCP) and REST interface for PyMDP active inference"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "aiohttp>=3.8.1",
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "inferactively-pymdp>=1.0.4",
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.13",
    "python-multipart>=0.0.6",
    "pillow>=9.0.0"
]

[project.urls]
"Homepage" = "https://github.com/ActiveInferenceInstitute/pymcp"
"Bug Tracker" = "https://github.com/ActiveInferenceInstitute/pymcp/issues"
"Repository" = "https://github.com/ActiveInferenceInstitute/pymcp"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "slow: runs a full PyMDP simulation or visualization and dominates suite wall time; deselected by `./run.sh test`",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.ruff]
line-length = 88
target-version = "py312"
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
unfixable = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["mcp"]
known-third-party = ["pymdp", "numpy", "matplotlib", "aiohttp", "fastapi", "pydantic"]

[tool.ruff.lint.per-file-ignores]
# Test modules and example scripts put `src/` (and pick the matplotlib backend)
# before importing project modules, so those imports cannot be at the top of the
# file. The pattern is structural, not sloppiness, so it is exempted once here
# instead of scattering `# noqa: E402` through the tree.
"tests/*" = ["E402"]
"scripts/*" = ["E402"]
