name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every gate command below is `./run.sh <arm>`, the same entry point a developer
# runs locally. No pytest/ruff/check command is spelled out in this file: the
# arms live in run.sh, their measured wall times in docs/_generated/gate-facts.md.
#
# Jobs are split by what they need installed, not by verb:
#   * `tests`             — one uv-managed Python 3.12, one frozen-lock sync, then
#                           lint, docs and the full suite in the same environment.
#   * `gnn-conformance`   — needs only the pinned parser (`./run.sh gnn` creates
#                           its isolated .gnn-venv), so it installs no project
#                           dependencies and repeats no lock resolution.
jobs:
  tests:
    name: test suite (python 3.12, frozen lock)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12 with uv
        # Shared org action, pinned by commit. Installs uv (pinned version) and
        # the interpreter with uv's dependency cache enabled, and changes no job
        # name.
        uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448
        with:
          python-version: "3.12"

      - name: Install the frozen environment
        run: ./run.sh setup

      - name: Lint (ruff, read-only)
        run: ./run.sh lint

      - name: Documentation links and generated facts
        run: ./run.sh docs

      - name: Full test suite
        run: ./run.sh test-full

  # Pin: .github/gnn-pin.json (schema gnn-importer-pin/v1, v5.0.3,
  # 8f293d9ba810e6eda5c09842d9c7ed9ffa5f92c1). What the job parses:
  # .github/GNN.md.
  gnn-conformance:
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12 with uv
        uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448
        with:
          python-version: "3.12"

      - name: Pinned GNN conformance
        run: ./run.sh gnn
