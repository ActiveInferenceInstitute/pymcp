name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Runs the documented gate of the repository against the committed lock:
    # `uv run python -m pytest tests/` (see tests/README.md and the README).
    name: test suite (python 3.12, frozen lock)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        # v10.3.3; setup-uv publishes no floating v10 major tag, so @v10 is unresolvable
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install the frozen environment
        run: uv sync --frozen --python 3.12

      - name: Run the test suite
        run: uv run --frozen python -m pytest tests/

  # GNN pin: .github/gnn-pin.json (v5.0.3, 8f293d9ba810e6eda5c09842d9c7ed9ffa5f92c1)
  gnn-conformance:
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned GNN parser
        run: |
          python -m pip install --disable-pip-version-check defusedxml psutil pyyaml
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          pin = json.loads(Path(".github/gnn-pin.json").read_text(encoding="utf-8"))
          assert pin["repository"] == "ActiveInferenceInstitute/Generalized_Notation_Notation"
          assert pin["tag"] == "v5.0.3"
          assert pin["revision"] == "8f293d9ba810e6eda5c09842d9c7ed9ffa5f92c1"
          spec = (
              "generalized-notation-notation @ "
              f"git+https://github.com/{pin['repository']}.git@{pin['revision']}"
          )
          subprocess.check_call(
              [sys.executable, "-m", "pip", "install", "--disable-pip-version-check", "--no-deps", spec]
          )
          PY
      - name: Verify pinned parser and repository sketches
        run: |
          python - <<'PY'
          import json
          import shutil
          import tempfile
          import urllib.request
          from pathlib import Path

          from gnn import __version__
          from gnn.parsers.basic import parse_gnn_formal, validate_gnn_syntax
          from gnn.type_checker import GNNTypeChecker

          pin = json.loads(Path(".github/gnn-pin.json").read_text(encoding="utf-8"))
          expected_version = pin["tag"].removeprefix("v")
          if __version__ != expected_version:
              raise SystemExit(f"installed GNN {__version__!r} does not match {pin['tag']!r}")

          sketches = sorted(Path(".").rglob("*.gnn.md"))
          if sketches:
              for sketch in sketches:
                  parsed = parse_gnn_formal(sketch)
                  if parsed is None or getattr(parsed, "parse_errors", None):
                      raise SystemExit(f"{sketch} did not parse cleanly")
                  valid, errors = validate_gnn_syntax(sketch.read_text(encoding="utf-8"))
                  if not valid:
                      raise SystemExit(f"{sketch} syntax errors: {errors!r}")
              with tempfile.TemporaryDirectory(prefix="repo-gnn-") as output_dir:
                  model_dir = Path(output_dir) / "models"
                  model_dir.mkdir()
                  for index, sketch in enumerate(sketches):
                      shutil.copy2(sketch, model_dir / f"{index:03d}_{sketch.name}")
                  if not GNNTypeChecker().validate_gnn_files(model_dir, Path(output_dir)):
                      raise SystemExit("GNN type checker rejected the repository sketches")
              checked = len(sketches)
              source = "repository"
          else:
              exemplar_url = (
                  "https://raw.githubusercontent.com/ActiveInferenceInstitute/"
                  "Generalized_Notation_Notation/"
                  f"{pin['revision']}/input/gnn_files/basics/static_perception.md"
              )
              with tempfile.TemporaryDirectory(prefix="pinned-exemplar-") as output_dir:
                  exemplar = Path(output_dir) / "static_perception.md"
                  urllib.request.urlretrieve(exemplar_url, exemplar)
                  parsed = parse_gnn_formal(exemplar)
                  if parsed is None or getattr(parsed, "parse_errors", None):
                      raise SystemExit("pinned exemplar did not parse cleanly")
                  valid, errors = validate_gnn_syntax(exemplar.read_text(encoding="utf-8"))
                  if not valid:
                      raise SystemExit(f"pinned exemplar syntax errors: {errors!r}")
                  model_dir = Path(output_dir) / "models"
                  model_dir.mkdir()
                  shutil.copy2(exemplar, model_dir / exemplar.name)
                  if not GNNTypeChecker().validate_gnn_files(model_dir, Path(output_dir)):
                      raise SystemExit("GNN type checker rejected the pinned exemplar")
              checked = 1
              source = "pinned-exemplar"

          print(
              json.dumps(
                  {
                      "gnn-version": __version__,
                      "pin-revision": pin["revision"],
                      "models": checked,
                      "source": source,
                      "result": "verified",
                  },
                  sort_keys=True,
              )
          )
          PY
